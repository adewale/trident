<svg id="zenuml" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 239.32px;" viewBox="0 0 239.32 179" role="graphics-document document" aria-roledescription="zenuml"><defs><style>
#zenuml .frame-border-outer{fill:#666}#zenuml .frame-border-inner,#zenuml .frame-header-bg{fill:#fff}#zenuml .frame-header-line{stroke:#666;stroke-width:1;shape-rendering:crispEdges}#zenuml .frame-title{font-family:Helvetica,Verdana,serif;font-size:16px;font-weight:600;fill:#222}#zenuml .participant-box{fill:#fff;stroke:#666;stroke-width:2}#zenuml .participant-label{font-family:Helvetica,Verdana,serif;font-size:16px;fill:#222}#zenuml .participant-icon{color:#222}#zenuml .participant-icon [fill="currentColor"]:not([stroke]){stroke:#666;stroke-width:1}#zenuml .participant-emoji{font-size:16px}#zenuml .stereotype-label{font-family:Helvetica,Verdana,serif;font-size:16px;fill:#222}#zenuml .lifeline{stroke:#666;stroke-width:1}#zenuml .message-line{stroke:#000;stroke-width:2;shape-rendering:crispEdges}#zenuml .message-label{font-family:Helvetica,Verdana,serif;font-size:14px;fill:#222}#zenuml .arrow-head{fill:#000;stroke:#000;stroke-width:2}#zenuml .arrow-open{fill:none}#zenuml .occurrence{fill:#dedede;stroke:#666;stroke-width:2;shape-rendering:crispEdges}#zenuml .fragment-border{fill:none;stroke:#666;stroke-width:1;shape-rendering:crispEdges}#zenuml .fragment-header{fill:#dedede;fill-opacity:.498;stroke:none;shape-rendering:crispEdges}#zenuml .fragment-label{font-family:Helvetica,Verdana,serif;font-size:14px;font-weight:600;fill:#000}#zenuml .fragment-condition{font-family:Helvetica,Verdana,serif;font-size:14px;fill:#000}#zenuml .fragment-separator{stroke:#e5e7eb;stroke-width:1;shape-rendering:crispEdges}#zenuml .fragment-section-label{font-family:Helvetica,Verdana,serif;font-size:14px;fill:#000}#zenuml .return-line{stroke:#000;stroke-width:2;stroke-dasharray:6,4;shape-rendering:crispEdges}#zenuml .return-arrow{stroke:#000;stroke-width:2;fill:none}#zenuml .return-label{font-family:Helvetica,Verdana,serif;font-size:14px;fill:#222}#zenuml .return-icon{fill:#222}#zenuml .divider-line{stroke:#aa3;stroke-width:1}#zenuml .divider-bg{fill:#fff5ad;stroke:#aa3;stroke-width:1}#zenuml .divider-label{font-family:Helvetica,Verdana,serif;font-size:14px;fill:#333}#zenuml .comment-text{font-family:Helvetica,Verdana,serif;font-size:14px;fill:#333;opacity:.5}#zenuml .seq-number{font-family:Helvetica,Verdana,serif;font-size:12px;font-weight:100;fill:#6b7280}#zenuml .group-outline{fill:none;stroke:#666}#zenuml .group-title-bg{fill:#fff;stroke:none}#zenuml .group-title-text{font-family:Helvetica,Verdana,serif;font-size:13px;font-weight:400;fill:#222}
