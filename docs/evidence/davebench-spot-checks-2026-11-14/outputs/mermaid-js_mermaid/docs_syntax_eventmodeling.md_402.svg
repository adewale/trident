p-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#spot_1 [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#spot_1 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="em-swimlane"><rect x="0" y="0" rx="3" width="1033" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="30">UI/Automation</text></g><g class="em-swimlane"><rect x="0" y="140" rx="3" width="1033" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="170">Command/Read Model</text></g><g class="em-swimlane"><rect x="0" y="280" rx="3" width="1033" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="310">Stream: External</text></g><g class="em-swimlane"><rect x="0" y="420" rx="3" width="1033" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="450">Stream: Cart</text></g><g class="em-box"><rect x="250" y="295" rx="3" width="242" height="100" stroke="#c19a0f" fill="#ffb778"></rect><foreignObject x="260" y="305" width="222" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text-align: center; vertical-align: middle;"><b>InventoryChanged</b></span></div></foreignObject></g><g class="em-box"><rect x="422" y="15" rx="3" width="252" height="100" stroke="#b88cbf" fill="#edb3f6"></rect><foreignObject x="432" y="25" width="232" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text-align: center; vertical-align: middle;"><b>InventoryProcessor</b></span></div></foreignObject></g><g class="em-box"><rect x="604" y="155" rx="3" width="232" height="100" stroke="#679ac3" fill="#bcd6fe"></rect><foreignObject x="614" y="165" width="212" heigh