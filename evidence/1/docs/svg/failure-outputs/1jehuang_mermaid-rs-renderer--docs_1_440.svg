n</tspan><tspan x="90.00" dy="21.60">house was</tspan><tspan x="90.00" dy="21.60">built in</tspan><tspan x="90.00" dy="21.60">Orkney,</tspan><tspan x="90.00" dy="21.60">Scotland</tspan></text><circle cx="250.00" cy="130.00" r="8" fill="#ECECFF" stroke="#7B88A8" stroke-width="2"/><line x1="250.00" y1="138.00" x2="250.00" y2="160.00" stroke="#7B88A8" stroke-width="2" stroke-dasharray="4,2"/><rect x="190.00" y="160.00" width="120.00" height="224.40" rx="5" ry="5" fill="#FFE6CC" stroke="#7B88A8" stroke-width="1"/><text x="250.00" y="180.00" text-anchor="middle" font-family="trebuchet ms,verdana,arial,DejaVu Sans,Liberation Sans,sans-serif,Noto Color Emoji,Apple Color Emoji,Segoe UI Emoji" font-size="16" fill="#333333" font-weight="bold"><tspan x="250.00" dy="0.00">6000 BC</tspan></text><text x="250.00" y="200.00" text-anchor="middle" font-family="trebuchet ms,verdana,arial,DejaVu Sans,Liberation Sans,sans-serif,Noto Color Emoji,Apple Color Emoji,Segoe UI Emoji" font-size="14.4" fill="#333333"><tspan x="250.00" dy="0.00">Sea levels</tspan><tspan x="250.00" dy="21.60">rise and</tspan><tspan x="250.00" dy="21.60">Britain</tspan><tspan x="250.00" dy="21.60">becomes an</tspan><tspan x="250.00" dy="21.60">island.</tspan><tspan x="250.00" dy="21.60">The people</tspan><tspan x="250.00" dy="21.60">who live here</tspan><tspan x="250.00" dy="21.60">are</tspan><tspan x="250.00" dy="21.60">hunter-gatherers.</tspan></text><circle cx="410.00" cy="130.00" r="8" fill="#ECECFF" stroke="#7B88A8" stroke-width="2"/><line x1="410.00" y1="138.00" x2="410.00" y2="160.00" stroke="#7B88A8" stroke-width="2" stroke-dasharray="4,2"/><rect x="350.00" y="160.00" width="120.00" height="181.20" rx="5" ry="5" fill="#D5E8D4" stroke="#7B88A8" stroke-width="1"/><text x="410.00" y="180.00" text-anchor="middle" font-family="trebuchet ms,verdana,arial,DejaVu Sans,Liberation Sans,sans-serif,Noto Color Emoji,Apple Color Emoji,Segoe UI Emoji" font-size="16" fill="#333333" font-weight="bold"><tspan x="410.00" dy="0.00">2300 BC</tspan></text><text x="410.00" y="200.00" text-anchor="middle" font-family="trebuchet ms,verdana,arial,DejaVu Sans,Liberation Sans,sans-serif,Noto Color Emoji,Apple Color Emoji,Segoe UI Emoji" font-size="14.4" fill="#333333"><tspan x="410.00" dy="0.00">People arrive</tspan><tspan x="410.00" dy="21.60">from Europe</tspan><tspan x="410.00" dy="21.60">and settle in</tspan><tspan x="410.00" dy="21.60">Britain.</tspan><tspan x="410.00" dy="21.60">They bring</tspan><tspan x="410.00" dy="21.60">farming and</tspan><tspan x="410.00" dy="21.60">metalworking.</tspan></text><circle cx="570.00" cy="130.00" r="8" fill="#ECECFF" stroke="#7B88A8" stroke-width="2"/><line x1="570.00" y1="138.00" x2="570.00" y2="160.00" stroke="#7B88A8" stroke-width="2" stroke-dasharray="4,2"/><rect x="510.00" y="160.00" width="120.00" height="224.40" rx="5" ry="5" fill="#F8CECC" stroke="#7B88A8" stroke-width="1"/><text x="570.00" y="180.00" text-anchor="middle" font-family="trebuchet ms,verdana,arial,DejaVu Sans,Liberation Sans,sans-serif,Noto Color Emoji,Apple Color Emoji,Segoe UI Emoji" font-size="16" fill="#333333" font-weight="bold"><tspan x="570.00" dy="0.00">2200 BC</tspan></text><text x="570.00" y="200.00" text-anchor="middle" font-family="trebuchet ms,verdana,arial,DejaVu Sans,Liberation Sans,sans-serif,Noto Color Emoji,Apple Color Emoji,Segoe UI Emoji" font-size="14.4" fill="#333333"><tspan x="570.00" dy="0.00">The last major</tspan><tspan x="570.00" dy="21.60">building</tspan><tspan x="570.00" dy="21.60">works are</tspan><tspan x="570.00" dy="21.60">completed at</tspan><tspan x="570.00" dy="21.60">Stonehenge.</tspan><tspan x="570.00" dy="21.60">People now</tspan><tspan x="570.00" dy="21.60">bury their</tspan><tspan x="570.00" dy="21.60">dead in stone</tspan><tspan x="570.00" dy="21.60">circles.</tspan></text></svg>