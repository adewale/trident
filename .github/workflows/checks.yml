name: Checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    name: Static checks and fixture tests
    # Playwright 1.58's dependency installer supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    # Package mirrors have taken 13 minutes to install Tesseract and Chromium's
    # dependencies; the limit that guards against a hung test is on the test step.
    timeout-minutes: 35
    env:
      MERMAID_REFERENCE_DIR: /nonexistent/trident-oracle
      MERMAID_UPSTREAM_DIR: /nonexistent/trident-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r fidelity/drawing/requirements.txt
      - run: sudo apt-get install -y tesseract-ocr
      # Chromium inspects checked-in fixtures; no project or benchmark runs.
      - run: bunx playwright install --with-deps chromium
      # GitHub's Ubuntu image links /usr/bin/chromium to a Chromium snapshot unrelated to
      # Trident's Playwright version, and Trident prefers /usr/bin/chromium when it exists.
      # Browser tests therefore ran an unsupported, never-warmed browser while this step warmed
      # Playwright's own, and they intermittently timed out. Point every browser test at
      # Playwright's Chromium, warm that same binary, and log both versions.
      - name: Use and warm Playwright's Chromium
        run: |
          path=$(bun -e "const { chromium } = await import('playwright'); console.log(chromium.executablePath())")
          echo "TRIDENT_CHROMIUM_EXECUTABLE=$path" >> "$GITHUB_ENV"
          echo "Playwright Chromium: $("$path" --version)"
          if [ -e /usr/bin/chromium ]; then echo "Runner /usr/bin/chromium (not used): $(/usr/bin/chromium --version)"; fi
          TRIDENT_CHROMIUM_EXECUTABLE="$path" bun -e "const { chromium } = await import('playwright'); const t = performance.now(); const b = await chromium.launch({ executablePath: process.env.TRIDENT_CHROMIUM_EXECUTABLE }); await (await b.newPage()).setContent('<p>warm</p>'); await b.close(); console.log('first Chromium launch', Math.round(performance.now() - t), 'ms')"
      - run: bun run lint
      - run: bun run typecheck
      - run: bun commands.ts results:snapshot --check
      - run: bun run test:ci
        timeout-minutes: 15
  macos-tests:
    # macOS temporary folders are symlinks (/var -> /private/var), which Linux paths never
    # exercise. This job only runs Trident's CI-safe fixture tests: no oracle, project
    # artifacts or benchmarks, which Trident refuses to run in CI.
    name: Fixture tests on macOS
    runs-on: macos-latest
    # Package mirrors have taken 13 minutes to install Tesseract and Chromium's
    # dependencies; the limit that guards against a hung test is on the test step.
    timeout-minutes: 35
    env:
      MERMAID_REFERENCE_DIR: /nonexistent/trident-oracle
      MERMAID_UPSTREAM_DIR: /nonexistent/trident-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r fidelity/drawing/requirements.txt
      - run: command -v tesseract || brew install tesseract
      # Chromium inspects checked-in fixtures; no project or benchmark runs.
      - run: bunx playwright install --with-deps chromium
      # GitHub's Ubuntu image links /usr/bin/chromium to a Chromium snapshot unrelated to
      # Trident's Playwright version, and Trident prefers /usr/bin/chromium when it exists.
      # Browser tests therefore ran an unsupported, never-warmed browser while this step warmed
      # Playwright's own, and they intermittently timed out. Point every browser test at
      # Playwright's Chromium, warm that same binary, and log both versions.
      - name: Use and warm Playwright's Chromium
        run: |
          path=$(bun -e "const { chromium } = await import('playwright'); console.log(chromium.executablePath())")
          echo "TRIDENT_CHROMIUM_EXECUTABLE=$path" >> "$GITHUB_ENV"
          echo "Playwright Chromium: $("$path" --version)"
          if [ -e /usr/bin/chromium ]; then echo "Runner /usr/bin/chromium (not used): $(/usr/bin/chromium --version)"; fi
          TRIDENT_CHROMIUM_EXECUTABLE="$path" bun -e "const { chromium } = await import('playwright'); const t = performance.now(); const b = await chromium.launch({ executablePath: process.env.TRIDENT_CHROMIUM_EXECUTABLE }); await (await b.newPage()).setContent('<p>warm</p>'); await b.close(); console.log('first Chromium launch', Math.round(performance.now() - t), 'ms')"
      - run: bun run test:ci
        timeout-minutes: 15
