name: Checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    name: Static checks and fixture tests
    # Playwright 1.58's dependency installer supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MERMAID_REFERENCE_DIR: /nonexistent/trident-oracle
      MERMAID_UPSTREAM_DIR: /nonexistent/trident-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      # Chromium inspects checked-in fixtures; no project or benchmark runs.
      - run: bunx playwright install --with-deps chromium
      - run: bun run lint
      - run: bun run typecheck
      - run: bun commands.ts results:snapshot --check
      - run: bun run test:ci
  macos-tests:
    # macOS temporary folders are symlinks (/var -> /private/var), which Linux paths never
    # exercise. This job only runs Trident's CI-safe fixture tests: no oracle, project
    # artifacts or benchmarks, which Trident refuses to run in CI.
    name: Fixture tests on macOS
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      MERMAID_REFERENCE_DIR: /nonexistent/trident-oracle
      MERMAID_UPSTREAM_DIR: /nonexistent/trident-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      # Chromium inspects checked-in fixtures; no project or benchmark runs.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:ci
