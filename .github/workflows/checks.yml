name: Checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    name: Static checks and fixture tests
    # Playwright 1.58's dependency installer supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MERMAID_REFERENCE_DIR: /nonexistent/trident-oracle
      MERMAID_UPSTREAM_DIR: /nonexistent/trident-source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r fidelity/drawing/requirements.txt
      - run: sudo apt-get install -y tesseract-ocr
      # Chromium inspects checked-in fixtures; no project or benchmark runs.
      - run: bunx playwright install --with-deps chromium
      - run: bun run lint
      - run: bun run typecheck
      - run: bun commands.ts results:snapshot --check
      - id: measurements
        run: bun commands.ts verify:measurements --out "$RUNNER_TEMP/trident-measurements"
      - uses: actions/upload-artifact@v4
        if: always() && steps.measurements.outcome != 'skipped'
        with:
          name: measurement-verification
          path: ${{ runner.temp }}/trident-measurements
          if-no-files-found: error
      - run: bun run test:ci
  macos-tests:
    # macOS temporary folders are symlinks (/var -> /private/var), which Linux paths never
    # exercise. This job only runs Trident's CI-safe fixture tests: no oracle, project
    # artifacts or benchmarks, which Trident refuses to run in CI.
    name: Fixture tests on macOS
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      MERMAID_REFERENCE_DIR: /nonexistent/trident-oracle
      MERMAID_UPSTREAM_DIR: /nonexistent/trident-source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r fidelity/drawing/requirements.txt
      - run: command -v tesseract || brew install tesseract
      # Chromium inspects checked-in fixtures; no project or benchmark runs.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:ci
