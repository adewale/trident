name: Native Flutter verification

on:
  pull_request:
    paths:
      - 'native-flutter/**'
      - '.github/workflows/native-flutter.yml'
  push:
    branches: [main]
    paths:
      - 'native-flutter/**'
      - '.github/workflows/native-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-flutter:
    name: Pinned Linux GTK release and native smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pinned Flutter release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/flutter
          ref: '3.47.8'
          path: .flutter-sdk
          persist-credentials: false
      - name: Install Linux desktop and headless runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb xauth libgl1-mesa-dri
      - name: Build the locked release target and run deterministic native checks
        run: |
          export FLUTTER_ROOT="$GITHUB_WORKSPACE/.flutter-sdk"
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = 737ba8f885dc774b53b442759999a312c9461e4e
          bash native-flutter/build.sh
      - name: Package the complete verified bundle
        run: tar -C native-flutter/app/build/linux/x64/release -czf "$GITHUB_WORKSPACE/native-flutter/app/build/native-flutter-linux-release.tar.gz" bundle
      - name: Retain the verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-flutter-linux-release
          path: native-flutter/app/build/native-flutter-linux-release.tar.gz
          if-no-files-found: error
          retention-days: 7
