  <text x="710.61075" y="103.7265" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">`@for@ Q@`</text>
</g>
<g class="node" data-id="AS1" data-label="@for@ AS@" data-shape="asymmetric">
  <polygon points="814.33725,40 919.27225,40 919.27225,76.9 814.33725,76.9 802.33725,58.45" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="860.80475" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">@for@ AS@</text>
</g>
<g class="node" data-id="AS2" data-label="`@for@ AS@`" data-shape="asymmetric">
  <polygon points="959.27225,40 1071.61725,40 1071.61725,76.9 959.27225,76.9 947.27225,58.45" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1009.44475" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">`@for@ AS@`</text>
