  <polygon points="212.57024999999996,40 310.16324999999995,40 319.38824999999997,58.45 310.16324999999995,76.9 212.57024999999996,76.9 203.34524999999996,58.45" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="261.36674999999997" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">@for@ H@</text>
</g>
