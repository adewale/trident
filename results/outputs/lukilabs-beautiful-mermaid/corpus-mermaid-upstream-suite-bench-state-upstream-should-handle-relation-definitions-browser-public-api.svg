<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 353.8" width="215" height="353.8" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="_start" data-to="State1" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="94.75,68 94.75,116" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="State1" data-to="_end" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="94.75,152.9 94.75,176.9 54,176.9 54,200.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="State1" data-to="State2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="94.75,152.9 94.75,176.9 135.5,176.9 135.5,200.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="State2" data-to="_end2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="135.5,237.8 135.5,285.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="_start" data-label="" data-shape="state-start">
  <circle cx="94.75" cy="54" r="12" fill="var(--_text)" stroke="none" />
</g>
<g class="node" data-id="State1" data-label="State1" data-shape="rounded">
  <rect x="57.47299999999999" y="116" width="74.554" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="94.75" y="134.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">State1</text>
</g>
<g class="node" data-id="_end" data-label="" data-shape="state-end">
  <circle cx="54" cy="214.9" r="12" fill="none" stroke="var(--_text)" stroke-width="1.5" />
  <circle cx="54" cy="214.9" r="8" fill="var(--_text)" stroke="none" />
</g>
<g class="node" data-id="State2" data-label="State2" data-shape="rounded">
  <rect x="96" y="200.9" width="79" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="135.5" y="219.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">State2</text>
</g>
<g class="node" data-id="_end2" data-label="" data-shape="state-end">
  <circle cx="135.5" cy="299.8" r="12" fill="none" stroke="var(--_text)" stroke-width="1.5" />
  <circle cx="135.5" cy="299.8" r="8" fill="var(--_text)" stroke="none" />
</g>
</svg>