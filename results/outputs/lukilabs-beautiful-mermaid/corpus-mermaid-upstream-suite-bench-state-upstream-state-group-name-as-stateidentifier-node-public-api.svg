<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 335.172 255.5" width="335.172" height="255.5" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="bigState1" data-label="Big State 1">
  <rect x="95.061" y="207.5" width="0" height="0" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="95.061" y="207.5" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="107.061" y="221.5" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Big State 1</text>
</g>
<g class="subgraph" data-id="bigState2" data-label="bigState2">
  <rect x="235.406" y="207.5" width="0" height="0" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="235.406" y="207.5" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="247.406" y="221.5" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">bigState2</text>
</g>
<polyline class="edge" data-from="namedState1" data-to="bigState1" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="should point to 
Big State 1 container" points="95.061,76.9 95.061,207.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="namedState2" data-to="bigState2" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="should point to 
bigState2 container" points="235.406,76.9 235.406,207.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="namedState1" data-to="bigState1" data-label="should point to 
Big State 1 container">
  <rect x="40.06100000000001" y="119.90000000000002" width="109.72000000000003" height="44.6" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="94.92100000000002" y="142.20000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)"><tspan x="94.92100000000002" dy="-3.3000000000000007">should point to </tspan><tspan x="94.92100000000002" dy="14.3">Big State 1 container</tspan></text>
</g>
<g class="edge-label" data-from="namedState2" data-to="bigState2" data-label="should point to 
bigState2 container">
  <rect x="180.906" y="119.90000000000002" width="108.53200000000002" height="44.6" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="235.17200000000003" y="142.20000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)"><tspan x="235.17200000000003" dy="-3.3000000000000007">should point to </tspan><tspan x="235.17200000000003" dy="14.3">bigState2 container</tspan></text>
</g>
<g class="node" data-id="namedState1" data-label="Small State 1" data-shape="rounded">
  <rect x="40" y="40" width="110.122" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="95.061" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Small State 1</text>
</g>
<g class="node" data-id="namedState2" data-label="Small State 2" data-shape="rounded">
  <rect x="178.122" y="40" width="114.568" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="235.406" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Small State 2</text>
</g>
</svg>