<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 236" width="360" height="236" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="cls-inherit" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto-start-reverse">
    <polygon points="0 0, 12 5, 0 10" fill="var(--bg)" stroke="var(--_arrow)" stroke-width="1.5" />
  </marker>
  <marker id="cls-composition" markerWidth="12" markerHeight="10" refX="0" refY="5" orient="auto-start-reverse">
    <polygon points="6 0, 12 5, 6 10, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
  <marker id="cls-aggregation" markerWidth="12" markerHeight="10" refX="0" refY="5" orient="auto-start-reverse">
    <polygon points="6 0, 12 5, 6 10, 0 5" fill="var(--bg)" stroke="var(--_arrow)" stroke-width="1.5" />
  </marker>
  <marker id="cls-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto-start-reverse">
    <polyline points="0 0, 8 3, 0 6" fill="none" stroke="var(--_arrow)" stroke-width="1.5" />
  </marker>
</defs>
<polyline class="class-relationship" data-from="C1" data-to="C2" data-type="association" data-marker-at="to" points="260,88 260,98 140,98 140,148" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#cls-arrow)" />
<polyline class="class-relationship" data-from="C3" data-to="C2" data-type="dependency" data-marker-at="to" points="100,88 100,148" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#cls-arrow)" />
<g class="class-node" data-id="C1" data-label="C1">
  <rect x="200" y="40" width="120" height="48" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="200" y="40" width="120" height="32" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="260" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="var(--_text)" dy="4.55">C1</text>
  <line x1="200" y1="72" x2="320" y2="72" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <line x1="200" y1="80" x2="320" y2="80" stroke="var(--_node-stroke)" stroke-width="0.75" />
</g>
<g class="class-node" data-id="C2" data-label="C2">
  <rect x="60" y="148" width="120" height="48" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="60" y="148" width="120" height="32" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="120" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="var(--_text)" dy="4.55">C2</text>
  <line x1="60" y1="180" x2="180" y2="180" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <line x1="60" y1="188" x2="180" y2="188" stroke="var(--_node-stroke)" stroke-width="0.75" />
</g>
<g class="class-node" data-id="C3" data-label="C3">
  <rect x="40" y="40" width="120" height="48" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="120" height="32" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="100" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="var(--_text)" dy="4.55">C3</text>
  <line x1="40" y1="72" x2="160" y2="72" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <line x1="40" y1="80" x2="160" y2="80" stroke="var(--_node-stroke)" stroke-width="0.75" />
</g>


</svg>