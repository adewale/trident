<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 297.8605 413.8" width="297.8605" height="413.8" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="NotShooting" data-label="Not Shooting State">
  <rect x="40" y="116" width="217.8605" height="257.8" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="116" width="217.8605" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="130" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Not Shooting State</text>
</g>
<polyline class="edge" data-from="_start" data-to="NotShooting" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="148.93025,68 148.93025,116" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="_start2" data-to="Idle" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="227.8605,272.9 227.8605,284.9 183.95325,284.9 183.95325,320.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Idle" data-to="Configuring" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="EvConfig" points="159.9425,320.9 159.9425,208.9 151.64466666666664,208.9 151.64466666666664,196.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Configuring" data-to="Idle" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="EvConfig" points="103.82233333333332,196.9 103.82233333333332,208.9 95.52449999999999,208.9 95.52449999999999,284.9 135.93175000000002,284.9 135.93175000000002,320.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Idle" data-to="Configuring" data-label="EvConfig">
  <rect x="129.4425" y="243.74999999999997" width="60.41800000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="159.6515" y="258.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">EvConfig</text>
</g>
<g class="edge-label" data-from="Configuring" data-to="Idle" data-label="EvConfig">
  <rect x="65.02449999999999" y="243.74999999999997" width="60.41800000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="95.23349999999999" y="258.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">EvConfig</text>
</g>
<g class="node" data-id="_start" data-label="" data-shape="state-start">
  <circle cx="148.93025" cy="54" r="12" fill="var(--_text)" stroke="none" />
</g>
<g class="node" data-id="Idle" data-label="Idle mode" data-shape="rounded">
  <rect x="111.921" y="320.9" width="96.04299999999999" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="159.9425" y="339.34999999999997" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Idle mode</text>
</g>
<g class="node" data-id="Configuring" data-label="Configuring mode" data-shape="rounded">
  <rect x="56" y="160" width="143.46699999999998" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="127.73349999999999" y="178.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Configuring mode</text>
</g>
<g class="node" data-id="_start2" data-label="" data-shape="state-start">
  <circle cx="227.8605" cy="258.9" r="12" fill="var(--_text)" stroke="none" />
</g>
</svg>