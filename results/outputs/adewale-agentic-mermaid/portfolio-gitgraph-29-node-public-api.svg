<svg xmlns="http://www.w3.org/2000/svg" width="382.635" height="240.33" viewBox="0 0 382.635 240.33" style="--bg:#FFFFFF;--fg:#27272A;--font:Inter;background:#FFFFFF" aria-labelledby="gitgraph-title" aria-roledescription="git graph" role="img">
<style>
  text { font-family: var(--font, 'Inter'), system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #27272A;
    --_text-sec:      #575759;
    --_text-muted:    #707072;
    --_text-faint:    #8a8a8c;
    --_line:          #939395;
    --_arrow:         #47474a;
    --_node-fill:     #f9f9f9;
    --_node-stroke:   #d4d4d4;
    --_group-fill:    #FFFFFF;
    --_group-hdr:     #f4f4f4;
    --_inner-stroke:  #e5e5e5;
    --_key-badge:     #e9e9ea;
  }
</style>
<title id="gitgraph-title">Git graph</title>
<g class="git-branch" data-id="branch:main" data-branch="main" data-role="group">
  <rect class="git-branch-label-background" x="82.28" y="53.33" width="37.72" height="18" rx="4" fill="#edf4fe" stroke="#3b82f6" stroke-width="1" />
  <line class="git-branch-line" data-branch="main" x1="130" y1="66.33" x2="274.855" y2="66.33" stroke="#3b82f6" stroke-width="3" opacity="0.86" />
  <text class="git-branch-label" data-branch="main" x="120" y="66.33" text-anchor="end" font-size="12" font-weight="600" fill="#366dc8" textLength="27.72" lengthAdjust="spacingAndGlyphs" data-font-metrics="deterministic-fit">main</text>
</g>
<polyline class="git-edge git-edge-parent" data-from="base" data-to="release" points="177.262,66.33 226.058,66.33 226.058,66.33 274.855,66.33" fill="none" stroke="#3b82f6" stroke-width="2" data-relationship="parent" data-direction="forward" data-id="base-&gt;release" data-role="edge" role="graphics-symbol" aria-roledescription="relation" aria-label="base to release" />
<g class="git-commit type-normal" data-id="base" data-branch="main" data-commit-type="NORMAL" data-role="node">
  <circle cx="177.262" cy="66.33" r="8" fill="#dce9fd" stroke="#3b82f6" stroke-width="2" />
  <rect class="git-commit-label-background" x="136.222" y="79.33" width="82.08" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94" stroke="#3b82f6" stroke-width="0.75" transform="rotate(45 177.262 90.33)" />
  <text class="git-commit-label" x="177.262" y="90.33" text-anchor="middle" font-size="11" fill="#575759" transform="rotate(45 177.262 90.33)" textLength="55.11" lengthAdjust="spacingAndGlyphs" data-font-metrics="deterministic-fit">Foundation</text>
</g>
<g class="git-commit type-normal" data-id="release" data-branch="main" data-commit-type="NORMAL" data-role="node">
  <circle cx="274.855" cy="66.33" r="8" fill="#dce9fd" stroke="#3b82f6" stroke-width="2" />
  <rect class="git-commit-label-background" x="220.335" y="79.33" width="109.041" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94" stroke="#3b82f6" stroke-width="0.75" transform="rotate(45 274.855 90.33)" />
  <text class="git-commit-label" x="274.855" y="90.33" text-anchor="middle" font-size="11" fill="#575759" transform="rotate(45 274.855 90.33)" textLength="80.652" lengthAdjust="spacingAndGlyphs" data-font-metrics="deterministic-fit">Prepare release</text>
</g>
</svg>