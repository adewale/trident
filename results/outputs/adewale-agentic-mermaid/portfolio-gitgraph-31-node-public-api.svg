<svg xmlns="http://www.w3.org/2000/svg" width="795.024" height="486" viewBox="0 0 795.024 486" style="--bg:#FFFFFF;--fg:#27272A;--font:Inter;background:#FFFFFF" aria-labelledby="gitgraph-title" aria-roledescription="git graph" role="img">
<style>
  text { font-family: var(--font, 'Inter'), system-ui, sans-serif; }
  svg {
